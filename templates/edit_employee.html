<!DOCTYPE html>
<html>
<head>

<title>Edit Employee</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}">

</head>
<body>

<div class="navbar">

<div class="logo">
AttendFlow
</div>

<a href="/employees" class="btn">
Employees
</a>

</div>

<div class="container">

<div class="card">

<h1>Edit Employee</h1>

<form method="POST">

<input
type="text"
name="name"
value="{{ employee[1] }}"
required>

<input
type="email"
name="email"
value="{{ employee[2] }}"
required>

<input
type="text"
name="department"
value="{{ employee[3] }}"
required>

<input
type="text"
name="phone"
value="{{ employee[4] }}"
required>

<button type="submit">
Update Employee
</button>

</form>

</div>

</div>

</body>
</html>
