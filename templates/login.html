<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2c3e50">
    <title>AttendFlow Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .login-container {
            min-height: calc(100vh - 160px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            background: white;
            border-radius: 16px;
            padding: 40px 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
        }

        .login-card h1 {
            text-align: center;
            font-size: 36px;
            margin-bottom: 10px;
        }

        .login-card > p {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 30px;
            font-size: 15px;
        }

        .login-card form {
            max-width: 100%;
        }

        .login-card input {
            width: 100%;
            padding: 12px 14px;
            font-size: 16px;
            margin-bottom: 15px;
        }

        .login-card button {
            width: 100%;
            padding: 12px 20px;
            font-size: 15px;
            margin-bottom: 20px;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #ecf0f1;
        }

        .register-link p {
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .register-link a {
            color: #3498db;
            text-decoration: none;
            font-weight: 600;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        @media screen and (max-width: 768px) {
            .login-container {
                padding: 15px;
            }

            .login-card {
                padding: 30px 20px;
            }

            .login-card h1 {
                font-size: 28px;
            }
        }

        @media screen and (max-width: 480px) {
            .login-container {
                padding: 12px;
                min-height: calc(100vh - 120px);
            }

            .login-card {
                padding: 20px 15px;
            }

            .login-card h1 {
                font-size: 24px;
                margin-bottom: 8px;
            }

            .login-card > p {
                font-size: 13px;
                margin-bottom: 20px;
            }

            .login-card input {
                padding: 11px 12px;
                margin-bottom: 12px;
            }

            .login-card button {
                padding: 11px 16px;
                font-size: 14px;
                margin-bottom: 15px;
            }
        }
    </style>
</head>

<body>
    <div class="navbar">
        <div class="logo">📊 AttendFlow</div>
    </div>

    <div class="login-container">
        <div class="login-card">
            <h1>Welcome Back</h1>
            <p>Attendance Management System</p>

            <form method="POST">
                <input type="text" name="username" placeholder="Username" required autofocus>
                <input type="password" name="password" placeholder="Password" required>
                <button type="submit">Sign In</button>
            </form>

            <div class="register-link">
                <p>Don't have an account?</p>
                <a href="/register">Create Account</a>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="footer-content">
            <h3>AttendFlow HRMS</h3>
            <p>Designed & Developed by <strong>Ch. Surya Teja</strong></p>
            <p>Email: suryachikkala09@gmail.com</p>
            <p>Attendance Management System for Employee Tracking</p>
            <p class="copyright">© 2026 AttendFlow. All Rights Reserved.</p>
        </div>
    </footer>
</body>
</html>
